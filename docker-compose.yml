services:
  postgres:
    image: postgres:16-alpine
    container_name: self-posted-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: self_posted
      POSTGRES_USER: self_posted
      POSTGRES_PASSWORD: devpassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
