services:
  postgres:
    image: postgres:16-alpine
    container_name: self-posted-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: self_posted
      POSTGRES_USER: self_posted
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  backend:
    build:
      context: ./backend
    container_name: self-posted-backend
    restart: unless-stopped

    volumes:
    - ./uploads:/app/uploads

    depends_on:
      - postgres

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/self_posted
      SPRING_DATASOURCE_USERNAME: self_posted
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8080
    
    ports:
      - "8085:8080"
  
  frontend:
    build:
      context: ./frontend
    container_name: self-posted-frontend
    restart: unless-stopped

    depends_on:
      - backend
    
    ports:
      - "4200:4200"

volumes:
  postgres_data:
